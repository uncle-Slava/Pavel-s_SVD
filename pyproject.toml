[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "svd-research-bench"
version = "0.3.0"
description = "Reproducible SVD experiments across CPU, CUDA, ROCm and experimental NPU backends"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.10", "torch>=2.0", "threadpoolctl>=3", "matplotlib>=3.7"]

[project.optional-dependencies]
laboratory = ["jupyterlab>=4", "pandas>=2"]
native = ["ninja"]

[project.scripts]
svdlab = "svdlab.__main__:main"
svdbench = "svdbench.cli:main"
svd-playground = "svdbench.playground.server:main"
svd-laboratory = "algorithm_laboratory.experiment:main"

[tool.setuptools.packages.find]
include = ["svdlab*", "svdbench*", "algorithm_laboratory*"]

[tool.setuptools.package-data]
"svdbench.playground" = ["static/*.html", "static/*.css", "static/*.js"]
